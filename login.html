<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>تسجيل دخول المشرف</title>

<link rel="stylesheet" href="style.css">

<style>

body{
display:flex;
justify-content:center;
align-items:center;
height:100vh;
background:#eef5fb;
font-family:Cairo;
}

.login{

width:400px;
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.15);

}

.login h2{

text-align:center;
margin-bottom:20px;
color:#0077cc;

}

</style>

</head>

<body>

<div class="login">

<h2>🔐 لوحة الإدارة</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button onclick="login()">

دخول

</button>

</div>

<script type="module" src="login.js"></script>

</body>

</html>
