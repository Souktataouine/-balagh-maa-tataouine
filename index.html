<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بلاغ ماء تطاوين Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="hero">

<h1>🚰 بلاغ ماء تطاوين</h1>

<p>منصة ذكية للإبلاغ عن انقطاع الماء والتسربات</p>

</header>

<div class="container">

<div class="card">

<h2>إرسال بلاغ</h2>

<input
id="name"
type="text"
placeholder="الاسم">

<select id="delegation">

<option value="">اختر المعتمدية</option>

<option>تطاوين الشمالية</option>

<option>تطاوين الجنوبية</option>

<option>غمراسن</option>

<option>الصمار</option>

<option>رمادة</option>

<option>ذهيبة</option>

<option>البئر الأحمر</option>

</select>

<select id="type">

<option>انقطاع ماء</option>

<option>تسرب ماء</option>

<option>كسر قناة</option>

<option>ضعف ضغط</option>

<option>عودة التزويد</option>

</select>

<textarea
id="details"
placeholder="اكتب تفاصيل البلاغ"></textarea>

<input
id="photo"
type="file"
accept="image/*">

<input
id="video"
type="file"
accept="video/*">

<div class="map-card">

<h3>📍 اختر مكان البلاغ</h3>

<div id="map"></div>

</div>

<button onclick="sendReport()">

إرسال البلاغ

</button>

</div>

<h2 class="reports-title">

📢 آخر البلاغات

</h2>

<div id="reports">

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script type="module" src="firebase.js"></script>

<script type="module" src="app.js"></script>

</body>

</html>
