<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚰 بلاغ ماء تطاوين</title>

<link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="hero">

<div class="overlay">

<h1>🚰 بلاغ ماء تطاوين</h1>

<p>منصة للإبلاغ عن انقطاع الماء وعودة التزويد</p>

</div>

</header>

<div class="container">

<div class="card">

<h2>🚨 إرسال بلاغ جديد</h2>

<p class="subtitle">
املأ البيانات ثم اضغط على إرسال البلاغ
</p>

<input
id="name"
type="text"
placeholder="الاسم">

<select id="delegation">

<option>تطاوين الشمالية</option>

<option>تطاوين الجنوبية</option>

<option>غمراسن</option>

<option>رمادة</option>

<option>ذهيبة</option>

<option>البئر الأحمر</option>

<option>الصمار</option>

</select>

<textarea
id="details"
placeholder="اكتب تفاصيل البلاغ">
</textarea>

<label class="upload">

📷 صورة البلاغ (اختياري)

<input
type="file"
id="photo"
accept="image/*">

</label>

<label class="upload">

🎥 فيديو البلاغ (اختياري)

<input
type="file"
id="video"
accept="video/*">

</label>

<button onclick="sendReport()">

🚀 إرسال البلاغ

</button>

</div>

<h2 class="reports-title">

📢 آخر البلاغات

</h2>

<div id="reports"></div>

</div>

<script type="module" src="app.js"></script>

</body>

</html>
