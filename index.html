<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚰 بلاغ ماء تطاوين</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

</head>

<body>

<header class="hero">

<h1>🚰 بلاغ ماء تطاوين</h1>

<p>منصة ذكية للإبلاغ عن انقطاع الماء والتسربات</p>

</header>

<div class="container">

<div class="card">

<h2>إرسال بلاغ</h2>

<input
id="name"
type="text"
placeholder="الاسم"
/>

<select id="delegation">

<option value="">اختر المعتمدية</option>

<option>تطاوين الشمالية</option>
<option>تطاوين الجنوبية</option>
<option>غمراسن</option>
<option>البئر الأحمر</option>
<option>رمادة</option>
<option>ذهيبة</option>
<option>الصمار</option>

</select>

<select id="type">

<option>انقطاع ماء</option>
<option>تسرب ماء</option>
<option>ضعف التزود</option>
<option>عطب شبكة</option>

</select>

<textarea
id="details"
placeholder="اكتب تفاصيل البلاغ"></textarea>

<div class="map-card">

<h3>📍 اختر مكان البلاغ</h3>

<div id="map"></div>

</div>

<button onclick="sendReport()">

إرسال البلاغ

</button>

</div>

<div class="card">

<h2>📢 آخر البلاغات</h2>

<div id="reports">

جاري التحميل...

</div>

</div>

</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module" src="app.js"></script>

</body>

</html>
